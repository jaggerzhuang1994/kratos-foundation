# Demo 各角色共用的框架配置；角色差异由环境变量 DEMO_ROLE 与 HTTP_DISABLE 控制。
app:
  stop_timeout: 20s
tracing:
  disable: true
server:
  stop_delay: 2s
  http:
    disable: ${HTTP_DISABLE:-false}
    addr: 0.0.0.0:8000
    metrics:
      addr: 0.0.0.0:9001
    health:
      addr: 0.0.0.0:9001
    # 管理端口提供 /debug/pprof/；业务端口不暴露。
    pprof:
      enable: true
  grpc:
    disable: true
registry:
  instances:
    default:
      driver: "null"
client:
  clients:
    inventory:
      protocol: HTTP
      target: http://inventory-api.shop.svc:8000
      # 查库存是幂等 GET：库存 503 时最多重试 3 次，客户端指标可见每次尝试。
      retry:
        enable: true
        backoff: 0.05s
        max_backoff: 0.2s
    orders:
      protocol: HTTP
      target: http://order-api.shop.svc:8000
      retry:
        enable: true
    gateway:
      protocol: HTTP
      target: http://gateway.shop.svc:8000
redis:
  default: main
  connections:
    main:
      addr: redis.middleware.svc:6379
      context_timeout_enabled: true
database:
  gorm:
    logger:
      level: WARN
      slow_threshold: 0.2s
  default: primary
  connections:
    primary:
      driver: mysql
      dsn: root:demo-local-only@tcp(mysql.middleware.svc:3306)/shop?charset=utf8mb4&parseTime=True&loc=UTC
      max_open_conns: 10
      max_idle_conns: 5
      # mysql-replica 是指向同一 MySQL 的独立 Service：演示只读查询的路由与独立连接池指标，不演示真实复制延迟。
      read_replicas:
        - dsn: root:demo-local-only@tcp(mysql-replica.middleware.svc:3306)/shop?charset=utf8mb4&parseTime=True&loc=UTC
kafka:
  connections:
    main:
      brokers: [kafka.middleware.svc:9092]
      dial_timeout: 5s
