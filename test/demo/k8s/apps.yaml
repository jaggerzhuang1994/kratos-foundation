# Demo 业务应用：同一镜像按 DEMO_ROLE 扮演不同角色，APP_NAME 取 Pod 标签使日志与注册名区分角色；由 test/demo/run.sh 生成 ConfigMap 并部署。
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: order-api, namespace: shop, labels: {app.kubernetes.io/name: order-api}}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: order-api}}
  template:
    metadata: {labels: {app.kubernetes.io/name: order-api, environment: dev}}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: foundation-demo:dev
          imagePullPolicy: Never
          args: [-config, /app/configs/config.yaml]
          env:
            - {name: DEMO_ROLE, value: api}
            - {name: APP_NAME, valueFrom: {fieldRef: {fieldPath: "metadata.labels['app.kubernetes.io/name']"}}}
            - {name: APP_ENV, value: dev}
            - {name: LOG_FILE_ENABLE, value: "false"}
          ports:
            - {name: http, containerPort: 8000}
            - {name: management, containerPort: 9001}
          startupProbe: {httpGet: {path: /healthz, port: management}, periodSeconds: 2, failureThreshold: 60}
          readinessProbe: {httpGet: {path: /readyz, port: management}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: management}, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          volumeMounts: [{name: config, mountPath: /app/configs, readOnly: true}]
      volumes: [{name: config, configMap: {name: shop-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: order-api, namespace: shop, labels: {app.kubernetes.io/name: order-api, environment: dev, demo: shop}}
spec:
  selector: {app.kubernetes.io/name: order-api}
  ports:
    - {name: http, port: 8000}
    - {name: management, port: 9001}
