# 一次性报表：每 2 分钟运行一次，约 30% 失败，演示 K8s Job/CronJob 告警。
apiVersion: batch/v1
kind: CronJob
metadata: {name: shop-report, namespace: shop, labels: {app.kubernetes.io/name: shop-report}}
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata: {labels: {app.kubernetes.io/name: shop-report}}
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata: {labels: {app.kubernetes.io/name: shop-report, environment: dev}}
        spec:
          restartPolicy: Never
          containers:
            - name: app
              image: foundation-demo:dev
              imagePullPolicy: Never
              args: [-config, /app/configs/config.yaml]
              env:
                - {name: DEMO_ROLE, value: report}
                - {name: APP_NAME, valueFrom: {fieldRef: {fieldPath: "metadata.labels['app.kubernetes.io/name']"}}}
                - {name: APP_ENV, value: dev}
                - {name: LOG_FILE_ENABLE, value: "false"}
                - {name: HTTP_DISABLE, value: "true"}
              volumeMounts: [{name: config, mountPath: /app/configs, readOnly: true}]
          volumes: [{name: config, configMap: {name: shop-config}}]
---
# 与 observability/kubernetes/servicemonitor.yaml 相同的采集身份，覆盖 shop 下所有应用。
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: shop-apps, namespace: shop}
spec:
  selector: {matchLabels: {demo: shop}}
  endpoints:
    - port: management
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: false
      relabelings:
        - {targetLabel: foundation, replacement: "true"}
        - {sourceLabels: [__meta_kubernetes_service_label_environment], targetLabel: env}
        - {targetLabel: cluster, replacement: kind-demo}
        - {sourceLabels: [__meta_kubernetes_namespace], targetLabel: namespace}
        - {sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_name], targetLabel: app}
        - {sourceLabels: [__meta_kubernetes_pod_node_name], targetLabel: node}
        - {sourceLabels: [__meta_kubernetes_pod_name], targetLabel: pod}
        - sourceLabels: [app, node, pod, __address__]
          separator: ";"
          regex: "(.*);(.*);(.*);(.*)"
          targetLabel: target
          replacement: "$1 / $2 / $3 / $4"
