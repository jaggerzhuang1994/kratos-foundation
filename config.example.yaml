# =============================================================================
# 服务客户端配置
# =============================================================================
client:
  # Wire cleanup 的排空等待上限；到期后强制关闭仍被租用的连接。[需重启]
  cleanup_timeout: 30s
  # clients 支持热更新；新增、修改和删除会影响后续 Factory 解析。
  clients:
    # 服务发现模式示例
    user-service:
      # 协议: GRPC, HTTP, HTTPS [默认: GRPC]
      protocol: GRPC
      # 目标端点 [默认: discovery:///{client_key}]
      # 支持服务发现: discovery:///service-name
      # 支持直连: host:port
      target: discovery:///user-service
      # 中间件配置
      middleware:
        # 调用预算配置
        deadline:
          # 父 Context 无截止时间时的兜底值 [默认: 10s；显式 0s 关闭回退超时]
          fallback_timeout: 2s
          # 单次调用最大耗时；无父预算且 fallback 为 0 时也会作为超时 [默认: 0s，不限制]
          max_timeout: 2s
          # 预算低于该值时不再发起请求 [默认: 0s，不检查]
          min_budget: 0.020s
          routes:
            - path: /api.user.v1.UserService/GetProfile
              fallback_timeout: 5s
              max_timeout: 5s
              min_budget: 0.020s
            # 同一规则只能设置 path 或 prefix；缺失预算继承客户端全局配置
            - prefix: /api.user.v1.UserService/
              fallback_timeout: 2s
              max_timeout: 2s
              min_budget: 0.020s
        # Metadata 配置
        metadata:
          # 是否禁用 [默认: false]
          disable: false
          # 固定携带的 metadata
          # constants:
          #   x-md-client-version: v1.0.0
          # 本 Client 仅向下游传播 x-md-global- 前缀
          prefix:
            - x-md-global-
        # 链路追踪
        tracing:
          disable: false
        # 监控
        metrics:
          disable: false
        # 日志
        logging:
          disable: false
        # 熔断器配置
        circuit_breaker:
          # 是否启用 [默认: false]
          enable: true
          # SRE 熔断器配置
          sre:
            # 成功率阈值 (K = 1/success) [默认: 0.6]
            # K = 1/success；提高 success 会降低 K，使熔断更激进
            success: 0.6
            # 最小请求数 [默认: 100]
            request: 100
            # 桶数量 [默认: 10]
            bucket: 10
            # 统计窗口时长 [默认: 3s]
            window: 3s

    # 直连模式示例
    # external-api:
    #   protocol: HTTPS
    #   target: api.example.com:443
    #   middleware:
    #     deadline:
    #       fallback_timeout: 10s
    #       max_timeout: 10s
    #     circuit_breaker:
    #       enable: true

  # 模块日志配置（仅构造时读取；变更记录需重启告警，不阻止 clients 更新）
  # log:
  #   # 禁用该模块日志 [默认: false]
  #   disable: false
  #   # 不填写时继承注入 Logger 的级别
  #   level: info
  #   # 过滤键支持尾部 * 前缀匹配
  #   filter_keys:
  #     - secret.*
