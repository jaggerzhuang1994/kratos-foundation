groups:
  - name: foundation-app
    rules:
      - alert: FoundationTargetDown
        expr: up{foundation="true"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "应用指标采集失败"
          runbook: "observability/troubleshooting.md#foundationtargetdown"
      - alert: FoundationAppNotReady
        expr: max by (env, cluster, namespace, app, pod) (app_ready{foundation="true"}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用实例持续未就绪（启动未完成、依赖不可用或停机卡住）"
          runbook: "observability/troubleshooting.md#foundationappnotready"
      - alert: FoundationAppUnavailable
        expr: max by (env, cluster, namespace, app) (app_ready{foundation="true"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "应用全部实例未就绪，服务不可用"
          runbook: "observability/troubleshooting.md#foundationappnotready"
      - alert: FoundationHighServerErrorRate
        expr: |
          (
            sum by (env, cluster, namespace, app) (rate(server_requests_code_total{foundation="true",code=~"5.."}[5m]))
            / sum by (env, cluster, namespace, app) (rate(server_requests_code_total{foundation="true"}[5m]))
          ) > 0.05
          and on (env, cluster, namespace, app)
          sum by (env, cluster, namespace, app) (increase(server_requests_code_total{foundation="true"}[5m])) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用 5xx 比例超过 5%，且最近 5 分钟请求至少 100 次"
          runbook: "observability/troubleshooting.md#foundationhighservererrorrate"
      - alert: FoundationHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le, env, cluster, namespace, app) (rate(server_requests_seconds_bucket{foundation="true"}[5m]))) > 0.5
          and on (env, cluster, namespace, app)
          sum by (env, cluster, namespace, app) (increase(server_requests_seconds_count{foundation="true"}[5m])) >= 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "应用 P95 超过 500ms，且最近 5 分钟请求至少 100 次"
          runbook: "observability/troubleshooting.md#foundationhighlatency"
      - alert: FoundationNodeCPUHigh
        expr: |
          (1 - avg by (env, cluster, node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.90
          and on (env, cluster, node) max by (env, cluster, node) (up{foundation="true"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "承载应用的机器 CPU 使用率超过 90%"
          runbook: "observability/troubleshooting.md#机器资源告警"
      - alert: FoundationNodeMemoryHigh
        expr: |
          (1 - max by (env, cluster, node) (node_memory_MemAvailable_bytes) / max by (env, cluster, node) (node_memory_MemTotal_bytes)) > 0.90
          and on (env, cluster, node) max by (env, cluster, node) (up{foundation="true"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "承载应用的机器内存使用率超过 90%"
          runbook: "observability/troubleshooting.md#机器资源告警"
      - alert: FoundationNodeDiskLow
        expr: |
          (max by (env, cluster, node) (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) / max by (env, cluster, node) (node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})) < 0.10
          and on (env, cluster, node) max by (env, cluster, node) (up{foundation="true"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "承载应用的机器根分区可用空间不足 10%"
          runbook: "observability/troubleshooting.md#机器资源告警"
  - name: foundation-components
    rules:
      - alert: FoundationKafkaRuntimeFailure
        expr: sum by (env,cluster,namespace,app,kafka_destination,kafka_consumer) (increase(kafka_consumer_runtime_failures_total{foundation="true"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Kafka 消费运行时出现故障"
          runbook: "observability/troubleshooting.md#组件告警"
      - alert: FoundationQueueRuntimeFailure
        expr: sum by (env,cluster,namespace,app,queue_destination,queue_consumer) (increase(queue_consumer_runtime_failures_total{foundation="true"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Queue 消费运行时出现故障"
          runbook: "observability/troubleshooting.md#组件告警"
      - alert: FoundationJobFailure
        expr: sum by (env,cluster,namespace,app,exported_job) (increase(job_runs_total{foundation="true",status="failure"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Job 执行失败"
          runbook: "observability/troubleshooting.md#组件告警"
      - alert: FoundationLockRenewalFailure
        expr: sum by (env,cluster,namespace,app,lock_name,result) (increase(lock_operations_total{foundation="true",operation="refresh",result=~"not_held|error|timeout"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Lock 续租失败，需确认任务是否停止受保护操作"
          runbook: "observability/troubleshooting.md#组件告警"
      - alert: FoundationRedisPoolTimeout
        # SDK 以 Gauge 暴露单调累计的 PoolStats.Timeouts；重建 client 时会归零。
        expr: sum by (env,cluster,namespace,app,redis_connection,pool_name) (increase(db_client_connections_timeouts{foundation="true",db_system="redis"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Redis 客户端连接池等待超时"
          runbook: "observability/troubleshooting.md#组件告警"
      - alert: FoundationDatabasePoolSaturated
        expr: (go_sql_in_use_connections{foundation="true"} / (go_sql_max_open_connections{foundation="true"} > 0)) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "数据库实例连接池利用率持续超过 90%"
          runbook: "observability/troubleshooting.md#组件告警"
  - name: foundation-state
    rules:
      - alert: FoundationHealthProbeFailed
        expr: probe_success{foundation_probe="true"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "应用 readyz 或 healthz 实际 HTTP 探测失败"
          runbook: "observability/troubleshooting.md#健康探测与配置状态"
      - alert: FoundationHealthProbeUnavailable
        expr: up{foundation_probe="true"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "健康探测结果采集失败，不能判断应用健康"
          runbook: "observability/troubleshooting.md#健康探测与配置状态"
      - alert: FoundationQueueStatsFailed
        expr: queue_stats_collection_success{foundation="true"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Queue 状态采集失败，积压数量与年龄不可用"
          runbook: "observability/troubleshooting.md#积压与传输指标"
      - alert: FoundationQueueReadyTooOld
        expr: max by (env,cluster,namespace,app,queue_destination) (queue_oldest_ready_age_seconds{foundation="true"}) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue 最老就绪任务等待超过 5 分钟"
          runbook: "observability/troubleshooting.md#积压与传输指标"
      - alert: FoundationKafkaLagHigh
        expr: sum by (env,cluster,kafka_cluster,consumergroup,topic) (max by (env,cluster,kafka_cluster,consumergroup,topic,partition) (kafka_consumergroup_lag{foundation_kafka="true"} >= 0)) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka 消费组 Topic Lag 持续超过 1000"
          runbook: "observability/troubleshooting.md#积压与传输指标"
  # 一次性脚本与 CronJob 以 K8s Job 状态为准：进程常在被抓取前退出，框架内 job_runs_total 可能来不及上报。
  # 依赖 kube-state-metrics；app 标签来自 kube_job_labels/kube_cronjob_labels，
  # 需在 kube-state-metrics 的 metricLabelsAllowlist 放开 app.kubernetes.io/name，否则 app 为空但告警仍触发。
  - name: foundation-kubernetes-jobs
    rules:
      - alert: FoundationJobFailed
        # 失败的 Job 在 failedJobsHistoryLimit 清理前一直存在；同一 CronJob 之后已有成功运行时视为已恢复，不再告警。
        expr: |
          max without (label_app_kubernetes_io_name) (
            label_replace(
              max by (env, cluster, namespace, job_name, owner_kind, owner_name) (
                (kube_job_status_failed > 0)
                * on (env, cluster, namespace, job_name) group_left (owner_kind, owner_name)
                  max by (env, cluster, namespace, job_name, owner_kind, owner_name) (kube_job_owner)
              )
              * on (env, cluster, namespace, job_name) group_left (label_app_kubernetes_io_name)
                max by (env, cluster, namespace, job_name, label_app_kubernetes_io_name) (kube_job_labels),
              "app", "$1", "label_app_kubernetes_io_name", "(.+)"
            )
          )
          unless on (env, cluster, namespace, job_name)
          (
            max by (env, cluster, namespace, job_name, owner_name) (
              kube_job_status_start_time
              * on (env, cluster, namespace, job_name) group_left (owner_name)
                max by (env, cluster, namespace, job_name, owner_name) (kube_job_owner{owner_kind="CronJob"})
            )
            < on (env, cluster, namespace, owner_name) group_left ()
            max by (env, cluster, namespace, owner_name) (
              label_replace(kube_cronjob_status_last_successful_time, "owner_name", "$1", "cronjob", "(.+)")
            )
          )
        labels:
          severity: warning
        annotations:
          summary: "K8s Job 执行失败（owner_name 为所属 CronJob，独立 Job 为 <none>）"
          runbook: "observability/troubleshooting.md#foundationjobfailed"
      - alert: FoundationCronJobMissedSchedule
        # 下次调度时间已过去 10 分钟仍未刷新：控制器未创建 Job、startingDeadlineSeconds 错过或 Forbid 策略被长任务阻塞。
        expr: |
          max without (label_app_kubernetes_io_name) (
            label_replace(
              ((time() - max by (env, cluster, namespace, cronjob) (kube_cronjob_next_schedule_time)) > 600)
              * on (env, cluster, namespace, cronjob) group_left (label_app_kubernetes_io_name)
                max by (env, cluster, namespace, cronjob, label_app_kubernetes_io_name) (kube_cronjob_labels),
              "app", "$1", "label_app_kubernetes_io_name", "(.+)"
            )
          )
          unless on (env, cluster, namespace, cronjob)
          (max by (env, cluster, namespace, cronjob) (kube_cronjob_spec_suspend) == 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CronJob 超过预定时间 10 分钟仍未调度"
          runbook: "observability/troubleshooting.md#foundationcronjobmissedschedule"
      - alert: FoundationCronJobNoRecentSuccess
        # 26h 适合每日调度；其他周期按“调度周期 × 允许连续失败次数 + 最长运行时间”复制规则并按 cronjob 过滤调整。
        # 从未成功的 CronJob 没有 last_successful_time 序列，由 FoundationJobFailed 覆盖。
        expr: |
          max without (label_app_kubernetes_io_name) (
            label_replace(
              ((time() - max by (env, cluster, namespace, cronjob) (kube_cronjob_status_last_successful_time)) > 26 * 3600)
              * on (env, cluster, namespace, cronjob) group_left (label_app_kubernetes_io_name)
                max by (env, cluster, namespace, cronjob, label_app_kubernetes_io_name) (kube_cronjob_labels),
              "app", "$1", "label_app_kubernetes_io_name", "(.+)"
            )
          )
          unless on (env, cluster, namespace, cronjob)
          (max by (env, cluster, namespace, cronjob) (kube_cronjob_spec_suspend) == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CronJob 超过 26 小时没有成功运行（阈值按调度周期调整）"
          runbook: "observability/troubleshooting.md#foundationcronjobnorecentsuccess"
      - alert: FoundationJobRunningTooLong
        # 1h 为演示阈值；长任务应同时设置 activeDeadlineSeconds，让 K8s 终止并标记失败。
        expr: |
          max without (label_app_kubernetes_io_name) (
            label_replace(
              (
                (time() - max by (env, cluster, namespace, job_name) (kube_job_status_start_time)) > 3600
                and on (env, cluster, namespace, job_name)
                max by (env, cluster, namespace, job_name) (kube_job_status_active) > 0
              )
              * on (env, cluster, namespace, job_name) group_left (label_app_kubernetes_io_name)
                max by (env, cluster, namespace, job_name, label_app_kubernetes_io_name) (kube_job_labels),
              "app", "$1", "label_app_kubernetes_io_name", "(.+)"
            )
          )
        labels:
          severity: warning
        annotations:
          summary: "K8s Job 运行超过 1 小时仍未结束"
          runbook: "observability/troubleshooting.md#foundationjobrunningtoolong"
  # 舰队总览与 SLO 使用的预聚合，按 env/cluster/namespace/app 汇总，避免几十个应用时重复计算原始序列。
  # 不按 foundation 标签过滤，与面板查询口径一致；告警规则仍使用原始指标。
  - name: foundation-records
    rules:
      - record: app:server_requests:rate5m
        expr: sum by (env, cluster, namespace, app) (rate(server_requests_code_total[5m]))
      - record: app:server_errors:rate5m
        expr: sum by (env, cluster, namespace, app) (rate(server_requests_code_total{code=~"5.."}[5m]))
      - record: app:server_requests_seconds_bucket:rate5m
        expr: sum by (env, cluster, namespace, app, le) (rate(server_requests_seconds_bucket[5m]))
      - record: app:app_ready:ready
        expr: sum by (env, cluster, namespace, app) (app_ready)
      - record: app:app_ready:instances
        expr: count by (env, cluster, namespace, app) (app_ready)
      - record: app:consumer_messages:rate5m
        expr: |
          label_replace(sum by (env, cluster, namespace, app) (rate(queue_consumer_messages_total[5m])), "consumer_type", "queue", "", "")
          or label_replace(sum by (env, cluster, namespace, app) (rate(kafka_consumer_messages_total[5m])), "consumer_type", "kafka", "", "")
      - record: app:consumer_failures:rate5m
        expr: |
          label_replace(sum by (env, cluster, namespace, app) (rate(queue_consumer_messages_total{queue_result=~"failed|storage_error"}[5m])), "consumer_type", "queue", "", "")
          or label_replace(sum by (env, cluster, namespace, app) (rate(kafka_consumer_messages_total{kafka_result=~"error|dead_lettered"}[5m])), "consumer_type", "kafka", "", "")
      - record: app:job_failures:increase1h
        expr: sum by (env, cluster, namespace, app) (increase(job_runs_total{status="failure"}[1h]))
      - record: app:queue_oldest_ready_age:max
        # 只取采集成功且最老年龄已知的观察者，与组件面板屏蔽失效样本的口径一致。
        expr: |
          max by (env, cluster, namespace, app) (
            queue_oldest_ready_age_seconds
            and on (env, cluster, namespace, app, pod, instance, queue_destination) (queue_stats_oldest_ready_known == 1)
            and on (env, cluster, namespace, app, pod, instance, queue_destination) (queue_stats_collection_success == 1)
          )
      # 以下为平台总览各分区的症状预聚合。基础设施指标先按对象去 kube-state-metrics / exporter 副本，
      # 只保留 env/cluster 与对象身份；exporter 未部署时规则无结果，面板显示“未接入”。
      - record: namespace:kube_pod_info:count
        # 区分“无异常”与“未接入 kube-state-metrics”：有发现的 Pod 时异常计数补 0。
        expr: count by (env, cluster, namespace) (max by (env, cluster, namespace, pod) (kube_pod_info))
      - record: cluster:kube_node_info:count
        expr: count by (env, cluster) (max by (env, cluster, node) (kube_node_info))
      - record: pod:kube_pod_not_ready:info
        # 非终态（Pending/Running/Unknown）却未 Ready 的 Pod；Succeeded/Failed 不计入。
        expr: |
          max by (env, cluster, namespace, pod, phase) (kube_pod_status_phase{phase=~"Pending|Running|Unknown"} == 1)
          unless on (env, cluster, namespace, pod) (max by (env, cluster, namespace, pod) (kube_pod_status_ready{condition="true"}) == 1)
      - record: pod:kube_pod_container_restarts:increase1h
        expr: sum by (env, cluster, namespace, pod) (max by (env, cluster, namespace, pod, container) (increase(kube_pod_container_status_restarts_total[1h]))) > 0
      - record: node:kube_node_not_ready:info
        expr: max by (env, cluster, node) (kube_node_status_condition{condition="Ready",status=~"false|unknown"}) == 1
      - record: node:kube_node_pressure:info
        expr: max by (env, cluster, node, condition) (kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure|NetworkUnavailable",status="true"}) == 1
      - record: instance:mysql_up:max
        expr: max by (env, cluster, instance) (mysql_up)
      - record: instance:mysql_connections:usage
        expr: max by (env, cluster, instance) (mysql_global_status_threads_connected) / (max by (env, cluster, instance) (mysql_global_variables_max_connections) > 0)
      - record: instance:mysql_slow_queries:rate5m
        expr: max by (env, cluster, instance) (rate(mysql_global_status_slow_queries[5m]))
      - record: instance:mysql_connection_errors:rate5m
        # 服务端连接错误（各 error 类型）与被中止的连接尝试（认证失败、超时等）合计。
        expr: |
          sum by (env, cluster, instance) (
            max by (env, cluster, instance, error) (rate(mysql_global_status_connection_errors_total[5m]))
            or label_replace(max by (env, cluster, instance) (rate(mysql_global_status_aborted_connects[5m])), "error", "aborted_connects", "", "")
          )
      - record: instance:mysql_replication_lag:seconds
        # 新版 MySQL 与 mysqld_exporter 使用 source 命名，旧版为 master。
        expr: max by (env, cluster, instance) (mysql_slave_status_seconds_behind_master or mysql_slave_status_seconds_behind_source)
      - record: app:go_sql_pool_usage:max
        # 先逐实例计算使用数 / 正数上限再取最大，避免应用汇总掩盖单个 Pod 耗尽；上限 0（无限）不参与。
        expr: max by (env, cluster, namespace, app, db_name) (go_sql_in_use_connections / (go_sql_max_open_connections > 0))
      - record: instance:redis_up:max
        expr: max by (env, cluster, instance) (redis_up)
      - record: instance:redis_memory:usage
        # 未设置 maxmemory 时上限为 0，比例无结果，不能当作 0%。
        expr: max by (env, cluster, instance) (redis_memory_used_bytes) / (max by (env, cluster, instance) (redis_memory_max_bytes) > 0)
      - record: instance:redis_evicted_keys:rate5m
        expr: max by (env, cluster, instance) (rate(redis_evicted_keys_total[5m]))
      - record: instance:redis_command_latency:avg5m
        expr: |
          sum by (env, cluster, instance) (max by (env, cluster, instance, cmd) (rate(redis_commands_duration_seconds_total[5m])))
          / (sum by (env, cluster, instance) (max by (env, cluster, instance, cmd) (rate(redis_commands_total[5m]))) > 0)
      - record: instance:redis_connected_clients:max
        expr: max by (env, cluster, instance) (redis_connected_clients)
      - record: group:kafka_consumergroup_lag:sum
        # 与 FoundationKafkaLagHigh 同口径：同分区去 exporter 副本，负值（位点未知）不计入。
        expr: sum by (env, cluster, kafka_cluster, consumergroup, topic) (max by (env, cluster, kafka_cluster, consumergroup, topic, partition) (kafka_consumergroup_lag >= 0))
      - record: queue:queue_oldest_ready_age:max
        expr: |
          max by (env, cluster, queue_destination) (
            queue_oldest_ready_age_seconds
            and on (env, cluster, namespace, app, pod, instance, queue_destination) (queue_stats_oldest_ready_known == 1)
            and on (env, cluster, namespace, app, pod, instance, queue_destination) (queue_stats_collection_success == 1)
          )
      - record: app:dead_letters:rate5m
        # Kafka 死信投递与 Queue 失败任务归档都表示消息最终未被处理，按结果全部计入。
        expr: |
          label_replace(sum by (env, cluster, namespace, app) (rate(kafka_consumer_dead_letters_total[5m])), "consumer_type", "kafka", "", "")
          or label_replace(sum by (env, cluster, namespace, app) (rate(queue_consumer_failed_tasks_total[5m])), "consumer_type", "queue", "", "")
      # 下游 downstream 由 operation 推导：gRPC 风格 /pkg.Service/Method 取服务名，其余保留完整 operation。
      - record: app_downstream:client_requests:rate5m
        expr: sum by (env, cluster, namespace, app, downstream) (label_replace(label_replace(rate(client_requests_code_total[5m]), "downstream", "$1", "operation", "(.*)"), "downstream", "$1", "operation", "/?([^/]+)/.+"))
      - record: app_downstream:client_errors:rate5m
        expr: sum by (env, cluster, namespace, app, downstream) (label_replace(label_replace(rate(client_requests_code_total{code=~"5.."}[5m]), "downstream", "$1", "operation", "(.*)"), "downstream", "$1", "operation", "/?([^/]+)/.+"))
      - record: app_downstream:client_requests_seconds_bucket:rate5m
        expr: sum by (env, cluster, namespace, app, downstream, le) (label_replace(label_replace(rate(client_requests_seconds_bucket[5m]), "downstream", "$1", "operation", "(.*)"), "downstream", "$1", "operation", "/?([^/]+)/.+"))
