groups:
  - name: foundation-app
    rules:
      - alert: FoundationTargetDown
        expr: up{foundation="true"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "应用指标采集失败"
          runbook: "deploy/observability/docs/troubleshooting.md#foundationtargetdown"
      - alert: FoundationAppNotReady
        expr: max by (env, cluster, namespace, app, pod) (app_ready{foundation="true"}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用实例持续未就绪（启动未完成、依赖不可用或停机卡住）"
          runbook: "deploy/observability/docs/troubleshooting.md#foundationappnotready"
      - alert: FoundationAppUnavailable
        expr: max by (env, cluster, namespace, app) (app_ready{foundation="true"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "应用全部实例未就绪，服务不可用"
          runbook: "deploy/observability/docs/troubleshooting.md#foundationappnotready"
      - alert: FoundationHighServerErrorRate
        expr: |
          (
            sum by (env, cluster, namespace, app) (rate(server_requests_code_total{foundation="true",code=~"5.."}[5m]))
            / sum by (env, cluster, namespace, app) (rate(server_requests_code_total{foundation="true"}[5m]))
          ) > 0.05
          and on (env, cluster, namespace, app)
          sum by (env, cluster, namespace, app) (increase(server_requests_code_total{foundation="true"}[5m])) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用 5xx 比例超过 5%，且最近 5 分钟请求至少 100 次"
          runbook: "deploy/observability/docs/troubleshooting.md#foundationhighservererrorrate"
      - alert: FoundationHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le, env, cluster, namespace, app) (rate(server_requests_seconds_bucket{foundation="true"}[5m]))) > 0.5
          and on (env, cluster, namespace, app)
          sum by (env, cluster, namespace, app) (increase(server_requests_seconds_count{foundation="true"}[5m])) >= 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "应用 P95 超过 500ms，且最近 5 分钟请求至少 100 次"
          runbook: "deploy/observability/docs/troubleshooting.md#foundationhighlatency"
      - alert: FoundationNodeCPUHigh
        expr: |
          (1 - avg by (env, cluster, node) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.90
          and on (env, cluster, node) max by (env, cluster, node) (up{foundation="true"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "承载应用的机器 CPU 使用率超过 90%"
          runbook: "deploy/observability/docs/troubleshooting.md#机器资源告警"
      - alert: FoundationNodeMemoryHigh
        expr: |
          (1 - max by (env, cluster, node) (node_memory_MemAvailable_bytes) / max by (env, cluster, node) (node_memory_MemTotal_bytes)) > 0.90
          and on (env, cluster, node) max by (env, cluster, node) (up{foundation="true"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "承载应用的机器内存使用率超过 90%"
          runbook: "deploy/observability/docs/troubleshooting.md#机器资源告警"
      - alert: FoundationNodeDiskLow
        expr: |
          (max by (env, cluster, node) (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) / max by (env, cluster, node) (node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})) < 0.10
          and on (env, cluster, node) max by (env, cluster, node) (up{foundation="true"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "承载应用的机器根分区可用空间不足 10%"
          runbook: "deploy/observability/docs/troubleshooting.md#机器资源告警"
  - name: foundation-components
    rules:
      - alert: FoundationKafkaRuntimeFailure
        expr: sum by (env,cluster,namespace,app,kafka_destination,kafka_consumer) (increase(kafka_consumer_runtime_failures_total{foundation="true"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Kafka 消费运行时出现故障"
          runbook: "deploy/observability/docs/troubleshooting.md#组件告警"
      - alert: FoundationQueueRuntimeFailure
        expr: sum by (env,cluster,namespace,app,queue_destination,queue_consumer) (increase(queue_consumer_runtime_failures_total{foundation="true"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Queue 消费运行时出现故障"
          runbook: "deploy/observability/docs/troubleshooting.md#组件告警"
      - alert: FoundationJobFailure
        expr: sum by (env,cluster,namespace,app,exported_job) (increase(job_runs_total{foundation="true",status="failure"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Job 执行失败"
          runbook: "deploy/observability/docs/troubleshooting.md#组件告警"
      - alert: FoundationLockRenewalFailure
        expr: sum by (env,cluster,namespace,app,lock_name,result) (increase(lock_operations_total{foundation="true",operation="refresh",result=~"not_held|error|timeout"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Lock 续租失败，需确认任务是否停止受保护操作"
          runbook: "deploy/observability/docs/troubleshooting.md#组件告警"
      - alert: FoundationRedisPoolTimeout
        # SDK 以 Gauge 暴露单调累计的 PoolStats.Timeouts；重建 client 时会归零。
        expr: sum by (env,cluster,namespace,app,redis_connection,pool_name) (increase(db_client_connections_timeouts{foundation="true",db_system="redis"}[5m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "Redis 客户端连接池等待超时"
          runbook: "deploy/observability/docs/troubleshooting.md#组件告警"
      - alert: FoundationDatabasePoolSaturated
        expr: (go_sql_in_use_connections{foundation="true"} / (go_sql_max_open_connections{foundation="true"} > 0)) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "数据库实例连接池利用率持续超过 90%"
          runbook: "deploy/observability/docs/troubleshooting.md#组件告警"
  - name: foundation-state
    rules:
      - alert: FoundationHealthProbeFailed
        expr: probe_success{foundation_probe="true"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "应用 readyz 或 healthz 实际 HTTP 探测失败"
          runbook: "deploy/observability/docs/troubleshooting.md#健康探测与配置状态"
      - alert: FoundationHealthProbeUnavailable
        expr: up{foundation_probe="true"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "健康探测结果采集失败，不能判断应用健康"
          runbook: "deploy/observability/docs/troubleshooting.md#健康探测与配置状态"
      - alert: FoundationQueueStatsFailed
        expr: queue_stats_collection_success{foundation="true"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Queue 状态采集失败，积压数量与年龄不可用"
          runbook: "deploy/observability/docs/troubleshooting.md#积压与传输指标"
      - alert: FoundationQueueReadyTooOld
        expr: max by (env,cluster,namespace,app,queue_destination) (queue_oldest_ready_age_seconds{foundation="true"}) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue 最老就绪任务等待超过 5 分钟"
          runbook: "deploy/observability/docs/troubleshooting.md#积压与传输指标"
      - alert: FoundationKafkaLagHigh
        expr: sum by (env,cluster,kafka_cluster,consumergroup,topic) (max by (env,cluster,kafka_cluster,consumergroup,topic,partition) (kafka_consumergroup_lag{foundation_kafka="true"} >= 0)) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka 消费组 Topic Lag 持续超过 1000"
          runbook: "deploy/observability/docs/troubleshooting.md#积压与传输指标"
  # 舰队总览与 SLO 使用的预聚合，按 env/cluster/namespace/app 汇总，避免几十个应用时重复计算原始序列。
  # 不按 foundation 标签过滤，与面板查询口径一致；告警规则仍使用原始指标。
  - name: foundation-records
    rules:
      - record: app:server_requests:rate5m
        expr: sum by (env, cluster, namespace, app) (rate(server_requests_code_total[5m]))
      - record: app:server_errors:rate5m
        expr: sum by (env, cluster, namespace, app) (rate(server_requests_code_total{code=~"5.."}[5m]))
      - record: app:server_requests_seconds_bucket:rate5m
        expr: sum by (env, cluster, namespace, app, le) (rate(server_requests_seconds_bucket[5m]))
      - record: app:app_ready:ready
        expr: sum by (env, cluster, namespace, app) (app_ready)
      - record: app:app_ready:instances
        expr: count by (env, cluster, namespace, app) (app_ready)
      - record: app:consumer_messages:rate5m
        expr: |
          label_replace(sum by (env, cluster, namespace, app) (rate(queue_consumer_messages_total[5m])), "consumer_type", "queue", "", "")
          or label_replace(sum by (env, cluster, namespace, app) (rate(kafka_consumer_messages_total[5m])), "consumer_type", "kafka", "", "")
      - record: app:consumer_failures:rate5m
        expr: |
          label_replace(sum by (env, cluster, namespace, app) (rate(queue_consumer_messages_total{queue_result=~"failed|storage_error"}[5m])), "consumer_type", "queue", "", "")
          or label_replace(sum by (env, cluster, namespace, app) (rate(kafka_consumer_messages_total{kafka_result=~"error|dead_lettered"}[5m])), "consumer_type", "kafka", "", "")
      - record: app:job_failures:increase1h
        expr: sum by (env, cluster, namespace, app) (increase(job_runs_total{status="failure"}[1h]))
      - record: app:queue_oldest_ready_age:max
        # 只取采集成功且最老年龄已知的观察者，与组件面板屏蔽失效样本的口径一致。
        expr: |
          max by (env, cluster, namespace, app) (
            queue_oldest_ready_age_seconds
            and on (env, cluster, namespace, app, pod, instance, queue_destination) (queue_stats_oldest_ready_known == 1)
            and on (env, cluster, namespace, app, pod, instance, queue_destination) (queue_stats_collection_success == 1)
          )
