# 普通 Prometheus 配置：替换地址及所有身份标签；必须逐实例采集，不能填写负载均衡地址。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["alerts.yaml"]
scrape_configs:
  - job_name: foundation-app
    honor_labels: false
    static_configs:
      - targets: ["127.0.0.1:9001"]
        labels:
          foundation: "true"
          env: prod
          cluster: vm-production
          namespace: standalone
          app: minimal-api
          node: vm-01
          pod: none
    relabel_configs:
      - source_labels: [app, node, pod, __address__]
        separator: ";"
        regex: "(.*);(.*);(.*);(.*)"
        target_label: target
        replacement: "$1 / $2 / $3 / $4"
  # 需在同一台 Linux 机器上部署 node-exporter；node 标签必须与应用目标一致。
  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          env: prod
          cluster: vm-production
          node: vm-01
  # 实际探测每个实例的健康端点；instance 保持与 /metrics 抓取地址一致。
  - job_name: foundation-health
    metrics_path: /probe
    scrape_timeout: 5s
    params:
      module: [foundation_health]
    static_configs:
      - targets: ["http://127.0.0.1:9001/healthz"]
        labels:
          foundation_probe: "true"
          probe: healthz
          env: prod
          cluster: vm-production
          namespace: standalone
          app: minimal-api
          node: vm-01
          pod: none
      - targets: ["http://127.0.0.1:9001/readyz"]
        labels:
          foundation_probe: "true"
          probe: readyz
          env: prod
          cluster: vm-production
          namespace: standalone
          app: minimal-api
          node: vm-01
          pod: none
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: "https?://([^/]+)/.*"
        target_label: instance
        replacement: "$1"
      - source_labels: [app, node, pod, instance]
        separator: ";"
        regex: "(.*);(.*);(.*);(.*)"
        target_label: target
        replacement: "$1 / $2 / $3 / $4"
      - target_label: __address__
        replacement: 127.0.0.1:9115
  # 默认文件为空，接入真实 exporter 后填入目标；共享 Kafka 不绑定某个业务 Pod。
  - job_name: foundation-kafka-lag
    scrape_interval: 30s
    scrape_timeout: 10s
    file_sd_configs:
      - files: ["/etc/prometheus/kafka-targets.json"]
