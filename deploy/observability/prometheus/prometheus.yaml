global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: ["/etc/prometheus/alerts.yaml"]
scrape_configs:
  - job_name: foundation-app
    honor_labels: false
    file_sd_configs:
      - files: ["/etc/prometheus/components-targets.json"]
    static_configs:
      - targets: ["app:9001"]
        labels:
          foundation: "true"
          env: local
          cluster: local
          namespace: standalone
          app: minimal-api
          node: local-docker
          pod: none
    relabel_configs:
      - source_labels: [app, node, pod, __address__]
        separator: ";"
        regex: "(.*);(.*);(.*);(.*)"
        target_label: target
        replacement: "$1 / $2 / $3 / $4"
  # 实际探测每个实例的健康端点；instance 保持与 /metrics 抓取地址一致。
  - job_name: foundation-health
    file_sd_configs:
      - files: ["/etc/prometheus/components-health-targets.json"]
    metrics_path: /probe
    scrape_timeout: 5s
    params:
      module: [foundation_health]
    static_configs:
      - targets: ["http://app:9001/healthz"]
        labels:
          foundation_probe: "true"
          probe: healthz
          env: local
          cluster: local
          namespace: standalone
          app: minimal-api
          node: local-docker
          pod: none
      - targets: ["http://app:9001/readyz"]
        labels:
          foundation_probe: "true"
          probe: readyz
          env: local
          cluster: local
          namespace: standalone
          app: minimal-api
          node: local-docker
          pod: none
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: "https?://([^/]+)/.*"
        target_label: instance
        replacement: "$1"
      - source_labels: [app, node, pod, instance]
        separator: ";"
        regex: "(.*);(.*);(.*);(.*)"
        target_label: target
        replacement: "$1 / $2 / $3 / $4"
      - target_label: __address__
        replacement: blackbox:9115
  # 默认文件为空，接入真实 exporter 后填入目标；共享 Kafka 不绑定某个业务 Pod。
  - job_name: foundation-kafka-lag
    scrape_interval: 30s
    scrape_timeout: 10s
    file_sd_configs:
      - files: ["/etc/prometheus/kafka-targets.json"]
