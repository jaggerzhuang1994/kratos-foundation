# 与 deploy/observability/compose.yaml 合并；相对路径以该基础文件目录为准。
services:
  components:
    build:
      context: ../..
      dockerfile: examples/components/Dockerfile
    environment:
      APP_ENV: local
      LOG_FILE_DISABLE: "true"
    volumes:
      - ../../examples/components/.runtime:/app/configs:ro
    ports: ["127.0.0.1:18010:8000", "127.0.0.1:19011:9001"]
    stop_grace_period: 40s
    depends_on:
      redis: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      oss-emulator: {condition: service_started}
  redis:
    image: redis:7.4.10-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  kafka:
    image: apache/kafka:4.1.2
    mem_limit: 2g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in components-events components-deadletter; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    command: ["--kafka.server=kafka:19092", "--kafka.version=4.1.2", "--topic.filter=components-.*", "--group.filter=components-.*", "--offset.show-all", "--group.metrics.timeout=8s"]
    depends_on:
      kafka-init: {condition: service_completed_successfully}
  oss-emulator:
    image: python:3.13-alpine
    command: [python3, /demo/oss-emulator.py]
    volumes: ["../../examples/components/oss-emulator.py:/demo/oss-emulator.py:ro"]
    networks:
      default:
        aliases: [assets-emulated.oss-emulator]
  prometheus:
    volumes:
      - ../../examples/components/targets.json:/etc/prometheus/components-targets.json:ro
      - ../../examples/components/health-targets.json:/etc/prometheus/components-health-targets.json:ro
      - ../../examples/components/kafka-targets.json:/etc/prometheus/kafka-targets.json:ro
