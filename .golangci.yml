version: "2"

# 公共库规则集：在 standard 之上只启用能发现真实缺陷、资源泄漏或 API 误用的检查器，
# 不引入纯风格偏好（revive、gocritic 风格类、perfsprint 等），避免门禁沦为噪音。
# 新增检查器前先用 `golangci-lint run --default=none --enable=<name>` 评估现有误报。

# 默认上限（每类 50 条、同类 3 条）会静默截断报告，让门禁看起来比实际干净。
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard # errcheck、govet、ineffassign、staticcheck、unused
  enable:
    # 正确性
    - asasalint # 可变参数误传 []any
    - durationcheck # 两个 time.Duration 相乘
    - reassign # 修改其他包的导出变量（如 io.EOF）
    - wastedassign # 被覆盖前从未使用的赋值
    - unconvert # 多余的类型转换
    - copyloopvar # Go 1.22+ 不再需要的循环变量副本
    - exptostd # golang.org/x/exp 中已进入标准库的函数
    - mirror # bytes/strings 互转的低效等价调用
    # 资源与数据库
    - rowserrcheck # sql.Rows 未检查 Err
    - sqlclosecheck # sql.Rows/Stmt 未关闭
    # 安全与源码卫生
    - bidichk # 源码中危险的 Unicode 双向控制字符
    - gocheckcompilerdirectives # 拼写错误的 //go: 指令
    - misspell
    - nolintlint # nolint 必须指明检查器并说明原因

  settings:
    errcheck:
      # Close 与 AddError 的返回值在这些类型上无法被调用方有效处理：
      # 解压器的校验错误由 Read 到 EOF 时返回，sql.Rows 的错误由 rows.Err() 反映，
      # gorm 的 AddError 本身就是把错误累积到 db.Error，返回值仅用于链式调用。
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*database/sql.Rows).Close
        - (*gorm.io/gorm.DB).AddError

    nolintlint:
      require-explanation: true
      require-specific: true

    staticcheck:
      # 前 6 项是 golangci-lint 的默认排除集（命名与包注释类风格约定），
      # 显式列出是因为一旦自定义 checks 就必须重新声明，否则会意外启用。
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # 保留嵌入字段的显式选择器，读代码时能直接看出字段来自哪一层。
        - -QF1008
        # 允许先声明默认值再按条件覆盖，与本仓库表达配置默认值的方式一致。
        - -QF1007
        # Go 惯例允许错误信息以专有名词开头，而本仓库大量错误以品牌名或人名起头
        # （Aliyun、Schnorr 等），ST1005 无法识别这类词，只会产生误报。
        - -ST1005

  exclusions:
    generated: strict
    rules:
      # 测试用例会故意传入 nil Context 来验证参数校验分支。
      - path: _test\.go
        text: do not pass a nil Context
        linters:
          - staticcheck
      # 测试只等待后台 goroutine 退出，接收值是否为 error 由各自断言处理。
      - path: _test\.go
        source: '^\s*(case )?<-'
        linters:
          - errcheck
      # ECIES 加密与 Schnorr 零知识证明都需要底层椭圆曲线点运算，crypto/ecdh 只覆盖
      # 密钥交换，不提供等价替代，因此这里只能继续使用已废弃的 elliptic 低层 API。
      - path: pkg/crypto/(ecc|schnorr)/
        text: "SA1019"
        linters:
          - staticcheck

# goimports 的分组属于风格偏好，启用会改写大量文件，因此只强制 gofmt。
formatters:
  enable:
    - gofmt
  exclusions:
    generated: strict
