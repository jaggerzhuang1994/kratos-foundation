syntax = "proto3";
option go_package = "github.com/jaggerzhuang1994/kratos-foundation/v2/proto/kratos_foundation_pb";

package kratos_foundation_pb;

import "pubg/jsonschema.proto";

import "config_pb/app.proto";
import "config_pb/job.proto";
import "config_pb/log.proto";
import "config_pb/tracing.proto";
import "config_pb/server.proto";
import "config_pb/database.proto";

import "config_pb/redis.proto";
import "config_pb/registry.proto";
import "config_pb/client.proto";
import "config_pb/kafka.proto";
import "config_pb/oss.proto";

option (pubg.jsonschema.file) = {
  entrypoint_message: "Config"
  title: "Kratos-Foundation Config Schema"
  description: "Kratos-Foundation Config Schema"
};

// Config 是 Foundation 的完整配置。
//
// 字段注释统一使用以下标记表达热更新语义：
//   [热更新] 修改后无需重启进程即可生效；
//   [需重启] 修改会被运行中的实例忽略，必须重启进程才会生效。
//
// 未标注的字段沿用其所在 message 顶部的说明。整体支持热更新的范围是：
// log、app.stop_timeout、server 的请求策略、client.clients、tracing.sampler
// 以及 database 各连接的连接池参数和 job.cron。
message Config {
  // 应用配置。仅 stop_timeout 支持热更新。
  optional App app = 1;
  // 链路追踪组件配置。仅 sampler 支持热更新。
  optional Tracing tracing = 2;
  // 服务组件配置。仅请求策略字段支持热更新。
  optional Server server = 3;
  // 数据库配置。仅各连接的连接池参数支持热更新。
  optional Database database = 4;
  // redis配置。[需重启]
  optional Redis redis = 5;
  // 服务注册。[需重启]
  optional Registry registry = 6;
  // 客户端组件配置。仅 clients 支持热更新。
  optional Client client = 7;
  // Kafka 连接配置。[需重启]
  optional Kafka kafka = 8;
  // 对象存储配置。[需重启]
  optional OSS oss = 9;
  // 全局输出日志策略。[热更新]。
  optional Logging log = 10;
  // 已注册 Cron 任务的调度和本进程并发策略。[热更新]
  optional Job job = 11;
}
