syntax = "proto3";
option go_package = "github.com/jaggerzhuang1994/kratos-foundation/v2/proto/kratos_foundation_pb/config_pb";

package kratos_foundation_pb;

import "config_pb/common.proto";
import "google/protobuf/duration.proto";
import "validate/validate.proto";

// Client 的 clients 支持热更新。修改 target 或 protocol 会从缓存摘除旧连接，
// 并在最后一个调用级引用释放后关闭。
message Client {
  // [热更新] 后续调用使用新配置，旧连接等待活跃调用释放。
  map<string, ClientOption> clients = 1;
  // cleanup 等待租约与在途活动的上限，默认 30s；超时强制关闭连接并记录日志。[需重启]
  optional google.protobuf.Duration cleanup_timeout = 2 [(validate.rules).duration = {gt: {}}];
}

message ClientOption {
  // 不指定协议时，AcquireClient 默认返回 gRPC 连接。
  optional Protocol protocol = 1;
  // 目标端点 支持服务发现/直连:
  // 默认为 discovery:///{client_key}
  // 也可以指定直连 host:port
  string target = 2;
  // 中间件
  optional ClientMiddleware middleware = 3;
  // discovery 目标使用的 registry.instances 名称；省略或空值默认 default。
  string discovery = 4;
}

enum Protocol {
  // grpc请求
  GRPC = 0;
  // http请求
  HTTP = 1;
  // https请求
  HTTPS = 3;
}

// 客户端中间件配置
message ClientMiddleware {
  optional Middleware.Metadata metadata = 1;
  optional Middleware.Tracing tracing = 2;
  optional Middleware.Metrics metrics = 3;
  optional Middleware.Logging logging = 4;
  optional Middleware.CircuitBreaker circuit_breaker = 5;
  optional Middleware.Deadline deadline = 6;
  // 请求级 debug 传播；服务端热更新，客户端随 clients 配置重建。
  optional Middleware.RequestDebug request_debug = 7;
}
