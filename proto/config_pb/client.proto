syntax = "proto3";
option go_package = "github.com/jaggerzhuang1994/kratos-foundation/v2/proto/kratos_foundation_pb/config_pb";

package kratos_foundation_pb;

import "config_pb/common.proto";
import "google/protobuf/duration.proto";
import "validate/validate.proto";

// Client 的 clients 支持热更新。修改 target 或 protocol 会从缓存摘除旧连接，
// 并在最后一个调用级引用释放后关闭。
message Client {
  // [热更新] 后续调用使用新配置，旧连接等待活跃调用释放。
  map<string, ClientOption> clients = 1;
  // [热更新] 各客户端缺失的 deadline 字段逐项继承根配置；此处缺失默认 10s，显式 0s 关闭回退超时。
  optional google.protobuf.Duration fallback_timeout = 3;
  // [热更新] 默认 0s，不限制本地最大耗时；各客户端可显式覆盖为 0s。
  optional google.protobuf.Duration max_timeout = 4;
  // [热更新] 默认 0s，不限制派发调用所需的最小剩余预算。
  optional google.protobuf.Duration min_budget = 5;
  // [热更新] 各客户端未指定 discovery 时使用的 registry.instances 名称；省略或空值默认 default。
  optional string discovery = 6;
  // cleanup 等待租约与在途活动的上限，默认 30s；超时强制关闭连接并记录日志。[需重启]
  optional google.protobuf.Duration cleanup_timeout = 2 [(validate.rules).duration = {gt: {}}];
}

message ClientOption {
  // 不指定协议时，AcquireClient 默认返回 gRPC 连接。
  optional Protocol protocol = 1;
  // 目标端点 支持服务发现/直连:
  // 默认为 discovery:///{client_key}
  // 也可以指定直连 host:port
  string target = 2;
  // discovery 目标使用的 registry.instances 名称；省略或空值继承 client.discovery。
  string discovery = 4;
  // 元数据透传配置。
  optional Middleware.Metadata metadata = 5;
  // Span 记录与导出开关；disable 省略时继承工厂启动 tracing.disable，关闭仍保留关联。
  optional Middleware.Tracing tracing = 6;
  optional Middleware.Metrics metrics = 7;
  optional Middleware.Logging logging = 8;
  optional Middleware.CircuitBreaker circuit_breaker = 9;
  optional Middleware.Deadline deadline = 10;
  // 请求级 debug 传播；服务端热更新，客户端随 clients 配置重建。
  optional Middleware.RequestDebug request_debug = 11;
  // 失败重试，默认关闭；随 clients 配置重建。
  optional Middleware.Retry retry = 12;
  // gRPC 连接参数，仅 GRPC 协议使用；修改后重建连接。
  optional GrpcClientOption grpc = 13;
}

// GrpcClientOption 是 gRPC 连接级参数。
message GrpcClientOption {
  // 空闲多久后发送 keepalive ping 探测连接，默认不发送。经负载均衡、NAT 或防火墙的长连接
  // 建议设为 30s，防止空闲连接被中间设备静默断开；不应小于服务端 keepalive_min_time，
  // 否则服务端以 too_many_pings 关闭连接。Foundation 服务端默认允许最短 10s。
  optional google.protobuf.Duration keepalive_time = 1 [(validate.rules).duration = {gte: {seconds: 10}}];
  // ping 等待应答的超时，超时即判定连接断开并重连，默认 10s。
  optional google.protobuf.Duration keepalive_timeout = 2 [(validate.rules).duration = {gt: {}}];
  // 没有进行中的 RPC 时是否也发送 ping，默认 true。
  optional bool keepalive_permit_without_stream = 3;
}

enum Protocol {
  // grpc请求
  GRPC = 0;
  // http请求
  HTTP = 1;
  // https请求
  HTTPS = 3;
}
