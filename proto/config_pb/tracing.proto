syntax = "proto3";
option go_package = "github.com/jaggerzhuang1994/kratos-foundation/v2/proto/kratos_foundation_pb/config_pb";

package kratos_foundation_pb;

import "google/protobuf/duration.proto";

// Tracing 只有 sampler 支持热更新。disable 决定是否创建真实 Provider，
// exporter 持有网络连接与批处理器，两者都需要重建 Provider。
message Tracing {
  reserved 2, 5;
  reserved "tracer_name", "log";

  // 是否禁用链路追踪 local 环境默认为禁用。[需重启]
  optional bool disable = 1;
  // 导出配置。[需重启]
  optional Exporter exporter = 3;
  // 采样率设置。
  // [热更新] 立即对后续新建的 span 生效，适合排障时临时提高采样率；已经开始的 trace
  // 仍沿用其原有采样决策。
  optional Sampler sampler = 4;
}

message Exporter {
  // 导出器的地址 http://host:port/path
  optional string endpoint_url = 1;
  // 是否压缩
  optional Compression compression = 2;
  // 额外请求头
  map<string, string> headers = 3;
  // 超时
  optional google.protobuf.Duration timeout = 4;
  // 重试策略
  optional RetryConfig retry = 5;

  enum Compression {
    // 不压缩
    NO = 0;
    // gzip压缩
    GZIP = 1;
  }

  message RetryConfig {
    // 是否启用重试
    optional bool enabled = 1;
    // 初始间隔
    optional google.protobuf.Duration initial_interval = 2;
    // 最大间隔
    optional google.protobuf.Duration max_interval = 3;
    // 单次执行允许的最大耗时
    optional google.protobuf.Duration max_elapsed_time = 4;
  }
}

message Sampler {
  // 所有策略均优先继承有效父 Span 的采样决定；以下策略用于本服务创建的根 trace。
  enum Sample {
    // 根 trace 按照 Trace ID 的稳定比例采样。
    RATIO = 0;
    // 根 trace 总是采样。
    ALWAYS = 1;
    // 根 trace 总是不采样。
    NEVER = 2;
  }
  // 根 trace 采样策略。
  optional Sample sample = 1;
  // RATIO 策略的采样率（默认 0.05）。
  optional double ratio = 2;
}
