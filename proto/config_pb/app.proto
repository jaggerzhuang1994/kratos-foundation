syntax = "proto3";
option go_package = "github.com/jaggerzhuang1994/kratos-foundation/v2/proto/kratos_foundation_pb/config_pb";

package kratos_foundation_pb;

import "google/protobuf/duration.proto";
import "config_pb/common.proto";

// App 只有 stop_timeout 支持热更新，其余字段在构造 Kratos App 时固定。
message App {
  // 保留 main 的 wire 编号，删除字段不能被新语义复用。
  reserved 1;
  reserved "disable_registrar";
  // 注册中心超时时间（默认10s）。[需重启]
  optional google.protobuf.Duration registrar_timeout = 2;
  // stop timeout 必须大于 server.stop_delay （默认30s）。
  // [热更新] 下次开始停机时读取；停机一旦开始，取值即冻结。
  optional google.protobuf.Duration stop_timeout = 3;
  // app暴露出去的端点（服务注册的端点，如果为空，则使用server导出的endpoint注册到服务中心）。[需重启]
  repeated Endpoint endpoints = 4;
  // 注册到服务中心的md。[需重启]
  map<string, string> metadata = 5;
}
