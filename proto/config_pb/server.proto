syntax = "proto3";
option go_package = "github.com/jaggerzhuang1994/kratos-foundation/v2/proto/kratos_foundation_pb/config_pb";

package kratos_foundation_pb;

import "pubg/jsonschema.proto";
import "google/protobuf/duration.proto";
import "config_pb/common.proto";
import "validate/validate.proto";

// Server 只有 middleware 支持热更新：中间件是纯请求策略，可以原子替换；监听地址、
// 端点和停机延迟决定 Server 实例本身，运行期无法安全切换。
message Server {

  // 业务 HTTP 与管理端点配置；业务监听和独立管理监听分别控制。[需重启]
  optional HttpServerOption http = 1;
  // grpc 服务器配置。[需重启]
  optional GrpcServerOption grpc = 2;
  // 通用中间件配置。[热更新] 逐项发布策略；并发请求可能短暂读取新旧策略组合。
  optional ServerMiddleware middleware = 3;
  // consul 服务发现会有1s左右延迟，所以在kratos生命周期中，
  // 服务deregister之后，不能马上停止服务，需要延迟一段时间后在停止服务，否则服务监听者还没有拉取最新服务列表，服务已经停止。
  // 因此给servers套上一个wrapper用于延迟停止服务。
  // [需重启] 该值在构造 Server 时冻结；建议 app.stop_timeout 预留更大的总停机预算，不做硬约束。
  optional google.protobuf.Duration stop_delay = 4;
}

message HttpServerOption {
  // 仅关闭业务 HTTP，默认 false；显式配置地址的管理端点仍可启动。[需重启]
  optional bool disable = 1;
  // 一般不需要指定，默认(tcp) 可选值: "tcp", "tcp4", "tcp6", "unix" or "unixpacket"
  optional string network = 2 [
    (pubg.jsonschema.field) = {string: {enum: ['tcp', 'tcp4', 'tcp6', 'unix', 'unixpacket']}},
    (validate.rules).string = {in: ['tcp', 'tcp4', 'tcp6', 'unix', 'unixpacket']}
  ];
  // 服务监听地址，host:port 或者 unix文件地址
  optional string addr = 3;
  // 对外暴露端点
  optional Endpoint endpoint = 4;
  // 禁用strictSlash（如果禁用strictSlash，则 /path/ 和 /path 是2个不同的路由，否则会自动重定向到另一个路由）
  optional bool disable_strict_slash = 5;
  // http 路由前缀
  optional string path_prefix = 6;
  // metrics 路由
  optional Metrics metrics = 7;
  // HTTP 健康检查端点。[需重启]
  optional Health health = 8;

  message Metrics {
    // 禁用
    optional bool disable = 1;
    // metrics 路由，默认 /metrics
    optional string path = 2;
    // 监听地址 host:port；空值复用业务 HTTP（业务关闭则不启动）；显式地址与已启用的业务地址相同时复用，否则独立监听。[需重启]
    optional string addr = 3;
  }
  message Health {
    optional bool disable = 1;
    // 空值复用业务 HTTP（业务关闭则不启动）；显式地址与已启用的业务地址相同时复用，否则独立监听；与 metrics.addr 相同则共享。[需重启]
    optional string addr = 2;
    // 存活探针路径，默认 /healthz。[需重启]
    // GET/HEAD 返回 200，仅表示 HTTP 可响应，不检查依赖或应用就绪状态。
    optional string liveness_path = 3;
    // 就绪探针路径，默认 /readyz。[需重启]
    // GET/HEAD 在应用完成启动、依赖检查通过且未停机时返回 200，否则返回 503。
    // 未绑定应用就绪状态时始终返回 503；NewServerBootstrap 自动绑定。
    optional string readiness_path = 4;
    // 全部关键依赖检查的总期限，默认一秒；检查函数必须响应 Context。
    optional google.protobuf.Duration timeout = 5;
  }
}

message GrpcServerOption {
  // 省略时仅非 nil 业务服务注册触发开启；false 显式开启，true 显式关闭。[需重启]
  optional bool disable = 1;
  // 一般不需要指定，默认(tcp)
  optional string network = 2 [
    (pubg.jsonschema.field) = {string: {enum: ['tcp', 'tcp4', 'tcp6', 'unix', 'unixpacket']}},
    (validate.rules).string = {in: ['tcp', 'tcp4', 'tcp6', 'unix', 'unixpacket']}
  ];
  // 服务监听地址，host:port
  optional string addr = 3;
  // 对外暴露端点
  optional Endpoint endpoint = 4;
  // customHealth 是否自定义健康检查，默认否（使用 grpc 自带的健康端点）
  optional bool custom_health = 5;
  // disableReflection 是否禁用服务反射
  optional bool disable_reflection = 6;
}

// 服务器中间件配置。
//
// [热更新] 全部字段都支持运行期修改，一次更新会先完整校验和构造，再逐项原子替换；并发请求可能短暂读取新旧组合。任何一项非法
// 都会整体拒绝并保留上一次生效的组合。这些中间件常驻调用链，因此把某项从禁用改为
// 启用也不需要重建 Server。
//
// 注意 tracing 还依赖构造期注入的 Provider：Provider 被禁用时，这里改成
// 启用也只会保留 TraceID/SpanID 关联，不会记录或导出 Span。
message ServerMiddleware {
  // 旧 Timeout 与 Deadline 语义不同，不复用其 wire 编号。
  // 元数据透传。[热更新]
  optional Middleware.Metadata metadata = 1;
  // Span 记录与导出开关；关闭仍保留 TraceID/SpanID 关联。[热更新]
  optional Middleware.Tracing tracing = 2;
  // 请求指标开关。[热更新]
  optional Middleware.Metrics metrics = 3;
  // 访问日志开关。[热更新] 适合排障时临时打开。
  optional Middleware.Logging logging = 4;
  // 请求校验开关。[热更新]
  optional Middleware.Validator validator = 5;
  // 自适应限流。[热更新] 适合突发流量时临时启用；重新启用会重置 BBR 的统计窗口。
  optional Middleware.RateLimit rate_limit = 6;
  // 请求截止时间。[热更新] 只影响新请求。
  optional Middleware.Deadline deadline = 7;
  // 请求级 debug 传播；服务端热更新，客户端随 clients 配置重建。
  optional Middleware.RequestDebug request_debug = 8;
}
