syntax = "proto3";
option go_package = "github.com/jaggerzhuang1994/kratos-foundation/v2/proto/kratos_foundation_pb/config_pb";

package kratos_foundation_pb;

import "google/protobuf/duration.proto";

// Metrics 配置指标的可选导出方式；全部字段在组装期读取一次。[需重启]
message Metrics {
  // 应用结束时向 Pushgateway 推送一次实例 Registry；省略或 url 为空时禁用。
  // 只建议一次性脚本（job ExitWhenDone）启用，常驻服务继续由 Prometheus 抓取 /metrics。[需重启]
  optional Push push = 1;
}

// Push 在应用结束（成功或失败）后的停止后钩子中执行一次 PUT，替换同一分组的上一次结果。
message Push {
  // Pushgateway 地址，例如 http://pushgateway.monitoring:9091；省略协议时按 http 处理。
  // 不包含 /metrics/job/... 路径；地址中的用户名密码转为 Basic Auth，不出现在日志中。
  optional string url = 1;
  // 分组 job 名（默认应用名）。分组键只含 job，不带 pod 或实例，避免 Pushgateway 分组基数膨胀。
  optional string job = 2;
  // 单次推送超时，须为正数（默认 5s）；超时只记录 WARN，不改变退出结果。
  optional google.protobuf.Duration timeout = 3;
}
